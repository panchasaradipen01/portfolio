<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Circle for perfect visibility on all browser themes -->
  <circle cx="16" cy="16" r="14.5" fill="#0f172a" />
  
  <!-- Outer glowing path -->
  <circle cx="16" cy="16" r="13" stroke="url(#paint0_linear)" stroke-width="1.2" opacity="0.4" />

  <!-- Monogram D - Teal -->
  <path d="M9 8.5H16C19.866 8.5 23 11.634 23 15.5C23 19.366 19.866 22.5 16 22.5H9V8.5Z" 
        stroke="#0d9488" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Monogram P - Orange (interlocking and offset slightly to the right/down) -->
  <path d="M14 14H18.5C21.2614 14 23.5 16.2386 23.5 19C23.5 21.7614 21.2614 24 18.5 24H14V27" 
        stroke="#ea580c" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Center connecting dot -->
  <circle cx="14" cy="14" r="1" fill="#ffffff" />

  <defs>
    <linearGradient id="paint0_linear" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>
</svg>
