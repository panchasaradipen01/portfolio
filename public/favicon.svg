<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Code Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 'D' Letter Glow / Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Slash Accent Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container / App Icon tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Coding Left Bracket '<' -->
  <path d="M 17 24 L 9 32 L 17 40" 
        stroke="url(#tagGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyanGlow)" />

  <!-- Coding Right Bracket '>' -->
  <path d="M 47 24 L 55 32 L 47 40" 
        stroke="url(#tagGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyanGlow)" />

  <!-- Prominent Central 'D' Letter -->
  <!-- Crisp, modern geometric D -->
  <path d="M 24 20 H 33.5 C 39.299 20 44 24.701 44 30.5 C 44 36.299 39.299 41 33.5 41 H 24 V 20 Z" 
        fill="none" 
        stroke="url(#dGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyanGlow)" />

  <!-- Inner D Accent / Cutout bar -->
  <line x1="24.2" y1="23" x2="24.2" y2="38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Modern Code Closing Slash '/' or Prompt accent in bottom corner of D -->
  <line x1="33" y1="36" x2="38" y2="44" stroke="url(#slashGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Subtle Terminal / Dev dot -->
  <circle cx="43" cy="20" r="2.2" fill="#00f2fe" filter="url(#cyanGlow)" />
</svg>
